<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request received | Selim Auto Care</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css?v=202610040142">
</head>
<body>
  <header class="nav">
    <div class="nav__inner container">
      <a href="/" class="brand" aria-label="Selim Auto Care home"><span class="brand__logo-wrap"><img src="/assets/img/logo.webp" alt="Mohammed Selim Absar Auto Repair Workshop" class="brand__logo" width="900" height="260"></span></a>
    </div>
  </header>
  <main class="thanks container">
    <div class="thanks__card">
      <div class="thanks__icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
      <h1 data-i18n="thanks.title">Request received</h1>
      <p data-i18n="thanks.text">Thank you. A technician will contact you on WhatsApp or by phone within one working hour.</p>
      <div class="thanks__wa" id="thanksWa" hidden>
        <p data-i18n="thanks.waHint">Want the fastest reply? Send the same request to our WhatsApp with one tap. The message is already written for you.</p>
        <a id="waLead" class="btn btn--wa btn--lg" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg><span data-i18n="thanks.wa">Send on WhatsApp too</span></a>
      </div>
      <div class="thanks__actions">
        <a href="/" class="btn btn--ghost" data-i18n="thanks.home">Back to the site</a>
        <a id="waLink" class="btn btn--ghost" href="#" target="_blank" rel="noopener"><span data-i18n="contact.wa">Chat on WhatsApp</span></a>
      </div>
    </div>
  </main>
  <script src="/assets/js/config.js?v=202610040142"></script>
  <script src="/assets/js/i18n.js?v=202610040142"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get('lang'); var saved = null;
      try { saved = localStorage.getItem('sac-lang'); } catch (e) {}
      var lang = (q || saved || 'en') === 'ar' ? 'ar' : 'en'; var d = window.I18N[lang];
      document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(function (el) { if (d[el.dataset.i18n]) el.textContent = d[el.dataset.i18n]; });
      document.title = (lang === 'ar' ? 'تم استلام طلبك' : 'Request received') + ' | Selim Auto Care';
      var S = window.SITE, num = S.phoneE164.replace(/[^\d]/g, '');
      document.getElementById('waLink').href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(S.whatsappText);
      // one-tap WhatsApp copy of the lead the visitor just sent (stored by the form before redirect)
      try {
        var lead = JSON.parse(sessionStorage.getItem('sac-lead') || 'null');
        if (lead && Date.now() - lead.at < 30 * 60 * 1000) {
          var L = lang === 'ar' ? { h: 'طلب خدمة جديد من الموقع', n: 'الاسم', m: 'الجوال', e: 'البريد', mo: 'الموديل', s: 'الخدمات', c: 'الشاصي', g: 'المحرك', x: 'ملاحظات' } : { h: 'New service request from the website', n: 'Name', m: 'Mobile', e: 'Email', mo: 'Model', s: 'Services', c: 'Chassis', g: 'Engine', x: 'Notes' };
          var lines = [L.h, L.n + ': ' + lead.name, L.m + ': ' + lead.mobile, L.e + ': ' + lead.email, L.mo + ': ' + lead.model, L.s + ': ' + lead.services];
          if (lead.chassis) lines.push(L.c + ': ' + lead.chassis); if (lead.engine) lines.push(L.g + ': ' + lead.engine); if (lead.message) lines.push(L.x + ': ' + lead.message);
          document.getElementById('waLead').href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(lines.join('\n'));
          document.getElementById('thanksWa').hidden = false;
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
