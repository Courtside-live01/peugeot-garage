<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex">

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav__inner container">
      <a href="/" class="brand" aria-label="Selim Auto Care home">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 40 40" width="40" height="40"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#1b4fd8"/></linearGradient></defs><path d="M20 2l16 7v11c0 9-7 15.5-16 18C11 35.5 4 29 4 20V9l16-7z" fill="url(#g1)"/><path d="M12 22l5 5 11-12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand__text"><span class="brand__name">SELIM <b>AUTO CARE</b></span><span class="brand__tag" data-i18n="brand.tag">Peugeot Specialists</span></span>
      </a>
    </div>
  </header>
  <main class="thanks container">
    <div class="thanks__card">
      <div class="thanks__icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
      <h1 data-i18n="thanks.title">Request received</h1>
      <p data-i18n="thanks.text">Thank you. A technician will contact you on WhatsApp or by phone within one working hour.</p>
      <div class="thanks__actions">
        <a href="/" class="btn btn--ghost" data-i18n="thanks.home">Back to the site</a>
        <a id="waLink" class="btn btn--wa" href="#" target="_blank" rel="noopener"><span data-i18n="contact.wa">Chat on WhatsApp</span></a>
      </div>
    </div>
  </main>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get('lang'); var saved = null;
      try { saved = localStorage.getItem('sac-lang'); } catch (e) {}
      var lang = (q || saved || 'en') === 'ar' ? 'ar' : 'en'; var d = window.I18N[lang];
      document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(function (el) { if (d[el.dataset.i18n]) el.textContent = d[el.dataset.i18n]; });
      document.title = (lang === 'ar' ? 'تم استلام طلبك' : 'Request received') + ' | Selim Auto Care';
      var S = window.SITE; document.getElementById('waLink').href = 'https://wa.me/' + S.phoneE164.replace(/[^\d]/g, '') + '?text=' + encodeURIComponent(S.whatsappText);
    })();
  </script>
</body>
</html>
